[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ide-dlc"
version = "0.1.0"
description = "Optional universal project and graphical runtime workbench for terminal IDEs"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
universal-ide-dlc = "project_dlc.cli:main"

[tool.setuptools]
packages = ["project_dlc"]
