[tab]
enabled = true
accept_key = "Tab"
toggle_key = "Ctrl-Alt-T"
position = "bottom-right"
mode = "code-only"
privacy = "offline-only"
on_demand_model = true
fallback = "lexical"

[tab.scheduler]
debounce_ms = 100
hard_timeout_ms = 450
max_tokens = 48
max_prefix_chars = 12000
max_suffix_chars = 6000
max_context_items = 8

[tab.model]
backend = "llama.cpp"
endpoint = "http://127.0.0.1:8137/infill"
model_file = "" # opt-in; no automatic model download
preferred_class = "coder-fim-1.5b-q4"
accelerator = "auto" # Metal on supported Apple Silicon, CPU otherwise
idle_unload_seconds = 300

[tab.privacy]
allow_remote_models = false
telemetry = false
upload_source = false
allow_model_download_without_approval = false
index_outside_workspace = false
